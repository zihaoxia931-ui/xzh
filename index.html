 <script type="module">const encoder=new TextEncoder();
const CONTEXT='xzh.workbench.v1';
const normalize=code=>String(code||'').trim().toUpperCase().replace(/[\s-]/g,'');
const fromBase64=text=>Uint8Array.from(atob(text),c=>c.charCodeAt(0));
async function unlockKey(code,vault){
 const normalized=normalize(code);
 if(!/^(?:[A-HJ-NP-Z2-9]{12}|XZH[A-F0-9]{32})$/.test(normalized))throw Error('INVALID_CODE');
 if(vault.version!==1||vault.kdf!=='PBKDF2-SHA256'||vault.iterations!==300000||!Array.isArray(vault.slots)||vault.slots.length>12)throw Error('BAD_VAULT');
 const material=await crypto.subtle.importKey('raw',encoder.encode(normalized),'PBKDF2',false,['deriveKey']);
 for(const slot of vault.slots){
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:fromBase64(slot.salt),iterations:vault.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);
  try{
   const raw=await crypto.subtle.decrypt({name:'AES-GCM',iv:fromBase64(slot.iv),additionalData:encoder.encode(CONTEXT+':keywrap:'+slot.id)},key,fromBase64(slot.wrappedKey));
   return await crypto.subtle.importKey('raw',raw,{name:'AES-GCM'},false,['decrypt']);
  }catch{}
 }
 throw Error('INVALID_CODE');
}
async function decryptArchive(key,vault,ciphertext){
 return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:fromBase64(vault.payload.iv),additionalData:encoder.encode(CONTEXT+':gzip')},key,ciphertext));
}

class TransferError extends Error {
 constructor(kind,file,status){super(kind);this.name='TransferError';this.kind=kind;this.file=file;this.status=status;}
}
const pause=ms=>new Promise(resolve=>setTimeout(resolve,ms));
const hashHex=async bytes=>Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes)),x=>x.toString(16).padStart(2,'0')).join('');
function createArchiveDownloader(manifest,{baseUrl,fetchImpl=fetch,delay=pause,timeoutMs=60000,attempts=3,concurrency=3,onProgress=()=>{}}={}){
 if(!manifest||!Array.isArray(manifest.parts)||manifest.parts.length<1||manifest.parts.length>64||!Number.isSafeInteger(manifest.bytes)||manifest.bytes>16000000)throw new TransferError('manifest');
 for(const p of manifest.parts)if(!/^archive-[a-f0-9]{12}-\d{2}\.json$/.test(p.file)||!Number.isSafeInteger(p.bytes)||p.bytes<1||p.bytes>262144||!/^[a-f0-9]{64}$/.test(p.sha256))throw new TransferError('manifest');
 if(manifest.parts.reduce((n,p)=>n+p.bytes,0)!==manifest.bytes||!/^[a-f0-9]{64}$/.test(manifest.sha256))throw new TransferError('manifest');
 const cache=new Map();let running=false;
 const report=()=>onProgress({completed:cache.size,total:manifest.parts.length,bytes:[...cache.values()].reduce((n,x)=>n+x.byteLength,0),totalBytes:manifest.bytes});
 async function loadPart(part){
  if(cache.has(part.file))return;
  let last;
  for(let attempt=0;attempt<attempts;attempt++){
   const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),timeoutMs);
   try{
    const response=await fetchImpl(new URL(part.file,baseUrl),{cache:'no-store',credentials:'omit',referrerPolicy:'no-referrer',signal:controller.signal});
    if(!response.ok)throw new TransferError('http',part.file,response.status);
    const text=await response.text();
    if(text.length>Math.ceil(part.bytes/3)*4+1024)throw new TransferError('content',part.file);
    let record;try{record=JSON.parse(text);}catch{throw new TransferError('content',part.file);}
    if(typeof record.data!=='string'||!/^[A-Za-z0-9+/]*={0,2}$/.test(record.data))throw new TransferError('content',part.file);
    let bytes;try{bytes=Uint8Array.from(atob(record.data),c=>c.charCodeAt(0));}catch{throw new TransferError('content',part.file);}
    if(bytes.byteLength!==part.bytes||await hashHex(bytes)!==part.sha256)throw new TransferError('integrity',part.file);
    cache.set(part.file,bytes);report();return;
   }catch(error){
    last=controller.signal.aborted?new TransferError('timeout',part.file):error instanceof TransferError?error:new TransferError('network',part.file);
   }finally{clearTimeout(timer);}
   if(last.kind==='http'&&last.status===404)throw last;
   if(attempt+1<attempts)await delay(750*(attempt+1));
  }
  throw last;
 }
 return {get completed(){return cache.size;},async download(){
  if(running)throw new TransferError('busy');running=true;report();
  try{
   const pending=manifest.parts.filter(p=>!cache.has(p.file));let cursor=0,firstError;
   await Promise.all(Array.from({length:Math.min(concurrency,pending.length)},async()=>{while(cursor<pending.length&&!firstError){const part=pending[cursor++];try{await loadPart(part);}catch(error){firstError??=error;}}}));
   if(firstError)throw firstError;
   const all=new Uint8Array(manifest.bytes);let offset=0;for(const part of manifest.parts){all.set(cache.get(part.file),offset);offset+=part.bytes;}
   if(await hashHex(all)!==manifest.sha256)throw new TransferError('integrity');
   return all;
  }finally{running=false;}
 }};
}

const form=document.querySelector('#inviteForm'),input=document.querySelector('#code'),button=document.querySelector('#enter'),message=document.querySelector('#message'),reveal=document.querySelector('#reveal'),progress=document.querySelector('#downloadProgress');
const vault=JSON.parse(document.querySelector('#encryptedVault').textContent);
let busy=false,lastCode='',unlockedKey=null,phase='code';
function status(text,error=false){message.textContent=text;message.classList.toggle('error',error);}
const downloader=createArchiveDownloader(vault.transfer,{baseUrl:location.href,onProgress:p=>{progress.hidden=false;progress.value=p.bytes;progress.max=p.totalBytes;status(`邀请码已验证，资料加载中：${p.completed}/${p.total}（${Math.round(p.bytes/p.totalBytes*100)}%）。网络慢时会自动重试。`);}});
reveal.addEventListener('click',()=>{const show=input.type==='password';input.type=show?'text':'password';reveal.setAttribute('aria-label',show?'隐藏邀请码':'显示邀请码');reveal.setAttribute('aria-pressed',String(show));});
form.addEventListener('submit',async event=>{
 event.preventDefault();if(busy)return;
 if(!isSecureContext||!crypto.subtle||typeof DecompressionStream==='undefined'){status('请使用新版 Chrome、Edge 或 Safari 打开 HTTPS 网址。',true);return;}
 busy=true;button.disabled=true;button.textContent='正在打开…';form.setAttribute('aria-busy','true');
 try{
  phase='code';status('正在本机验证邀请码…');
  if(Date.parse(vault.expiresAt)<=Date.now())throw Error('EXPIRED');
  const code=normalize(input.value);
  if(!unlockedKey||code!==lastCode){unlockedKey=null;lastCode='';unlockedKey=await unlockKey(code,vault);lastCode=code;}
  phase='download';const ciphertext=await downloader.download();
  phase='decrypt';status('资料已完整下载，正在解密…');
  const packed=await decryptArchive(unlockedKey,vault,ciphertext);
  phase='document';const stream=new Blob([packed]).stream().pipeThrough(new DecompressionStream('gzip'));
  const html=await new Response(stream).text();
  if(!/^<!doctype html>/i.test(html))throw Error('BAD_DOCUMENT');
  input.value='';lastCode='';unlockedKey=null;
  const exit='<a href="./" style="position:fixed;left:16px;bottom:12px;z-index:10000;padding:8px 12px;border:1px solid #a58a6b66;border-radius:4px;background:#211d18;color:#e1c2a1;font:12px sans-serif;text-decoration:none" aria-label="退出并锁定工作台">退出并锁定 ↗</a>';
  document.open();document.write(html.replace('</body>',exit+'</body>'));document.close();
 }catch(error){
  let text;
  if(error.message==='INVALID_CODE')text='邀请码不正确，请检查后重试。';
  else if(error.message==='EXPIRED')text='当前分享已到期，请联系分享者。';
  else if(error instanceof TransferError){
   const done=`已保留 ${downloader.completed}/${vault.transfer.parts.length} 段。`;
   text=error.kind==='http'&&error.status===404?'资料分段暂未发布完整（404）。请稍后刷新重试。':error.kind==='http'?`资料下载返回 ${error.status}。${done}点击“继续加载”重试。`:error.kind==='integrity'||error.kind==='content'?`网络返回的文件不完整或内容异常。${done}点击“继续加载”重新校验。`:`邀请码已验证，但资料下载${error.kind==='timeout'?'超时':'中断'}。${done}点击“继续加载”，无需重输邀请码。`;
  }else text=phase==='decrypt'?'资料完整，但解密校验失败，请联系分享者检查版本。':phase==='document'?'浏览器无法展开资料，请使用新版 Chrome、Edge 或 Safari 重试。':'无法完成本机验证，请刷新页面重试。';
  status(text,true);busy=false;button.disabled=false;button.textContent=phase==='download'?'继续加载 ↗':'进入工作台 ↗';form.removeAttribute('aria-busy');
 }
});
